<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src [https://www.youtube.com](https://www.youtube.com) [https://www.youtube-nocookie.com](https://www.youtube-nocookie.com); base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>What Happens When We Sleep? – B1 ESL worksheet</title>
<style>
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#f7f9fc; --border:#e1e7ef; --text:#0f172a; --muted:#5b6b82;
  --primary:#2563eb; --primary-600:#1d4ed8; --primary-soft:#e8f0fe; --on-primary:#ffffff; --accent:#0d9488;
  --ok:#15803d; --ok-soft:#e7f6ec; --bad:#b91c1c; --bad-soft:#fdecec; --warn:#a16207; --warn-soft:#fff4d6;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07); --radius:16px;
}
html[data-theme="dark"]{
  --bg:#101826; --surface:#182235; --surface-2:#1d2940; --border:#2b3a56; --text:#e8edf6; --muted:#9db0cc;
  --primary:#7aa7ff; --primary-600:#9bbcff; --primary-soft:#1f3057; --on-primary:#0b1220; --accent:#2dd4bf;
  --ok:#4ade80; --ok-soft:#12301f; --bad:#f87171; --bad-soft:#3a1b1f; --warn:#fbbf24; --warn-soft:#3a2d12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not(:disabled){background:var(--primary-600);border-color:var(--primary-600)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* ----- worksheet ----- */
.ws{max-width:900px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}
.ws-bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--primary-soft),var(--surface) 70%)}
.hero h1{font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.2;font-weight:800;letter-spacing:-.02em;margin-top:12px}
.hero .lead{color:var(--muted);margin-top:8px;font-size:1.02rem}
.hero .src{margin-top:12px;font-size:12.5px;color:var(--muted);word-break:break-all}
.hero .src a{color:var(--primary)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:11.5px;font-weight:700;letter-spacing:.05em}
.badge-warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.name-line{margin-top:14px;display:none;gap:40px}
.sec-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.sec-n{flex:none;width:34px;height:34px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800}
.sec-h h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
h3.mini{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.topic{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:14px 16px}
.topic-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--primary)}
.topic p{margin-top:4px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip:hover{background:var(--primary-soft);border-color:var(--primary)}
textarea.notes,.blank-in{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:11px;padding:10px 12px;resize:vertical}
textarea.notes:focus,.blank-in:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.print-only{display:none}

.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.fc-wrap{position:relative}
.fc{display:block;width:100%;height:190px;padding:0;border:0;background:none;perspective:1000px;cursor:pointer;text-align:left}
.fc-in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc[aria-pressed="true"] .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fc-front{border-top:4px solid var(--primary)}
.fc-back{transform:rotateY(180deg);border-top:4px solid var(--accent);background:var(--surface)}
.fc:hover .fc-face{border-color:var(--primary)}
.pos{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:1px 8px;border-radius:6px}
.fc-term{display:block;font-size:1.15rem;font-weight:700;margin-top:10px;line-height:1.25}
.fc-ph{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.fc-hint{font-size:11.5px;color:var(--primary);font-weight:600}
.fc-def{display:block;font-size:13.5px;line-height:1.4}
.fc-ex{display:block;font-size:12.5px;font-style:italic;color:var(--muted);margin-top:8px}
.fc-lab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);display:block;margin-bottom:3px}
.fc-speak{position:absolute;top:10px;right:10px;border:1px solid var(--border);background:var(--surface);border-radius:9px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center;font-size:14px;z-index:2}
.fc-speak:hover{background:var(--primary-soft)}
table.vtable{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.vtable th,.vtable td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}

.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bank span{background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:3px 11px;font-weight:600;font-size:13px}
.bq{padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;margin-bottom:10px}
.bq-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.blank-in{width:auto;flex:1 1 180px;max-width:300px;resize:none;padding:7px 11px}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--muted);margin:0 3px}
.res{font-weight:700;font-size:13px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.key-ans{display:none;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:3px 10px;border-radius:8px;width:fit-content}
.show-key .key-ans{display:block}

.player{aspect-ratio:16/9;width:100%;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border)}
.player iframe{width:100%;height:100%;border:0;display:block}
.yt-link{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--primary)}
.ts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ts{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:10px 12px;cursor:pointer}
.ts:hover{border-color:var(--primary);background:var(--primary-soft)}
.ts b{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--primary)}
.ts span{font-size:12.5px}

.q{padding:18px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;margin-bottom:12px}
.q-t{font-weight:700;margin-bottom:12px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border:1.5px solid var(--border);background:var(--surface);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--primary)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);border:1.5px solid var(--border)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent)}
.opt.good{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.opt.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.show-key .opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.fb{display:none;margin-top:10px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--border)}
.q.answered .fb,.show-key .fb{display:block}
.fb-res{font-weight:700;margin-right:6px}
.fb-res.ok{color:var(--ok)}.fb-res.bad{color:var(--bad)}
.fb .key-ans{margin:0 8px 0 0}
.show-key .fb .key-ans{display:inline-block}
.persona{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.persona-h{display:flex;gap:10px;align-items:center;font-weight:700}
.persona-h .ic{font-size:1.5rem}
.persona .pr{font-style:italic;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}

@media print{
  html,html[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#fff;--border:#cbd5e1;--text:#000;--muted:#334155;--primary:#1e3a8a;--primary-soft:#fff;--on-primary:#fff;--shadow:none;--ok:#166534;--ok-soft:#fff;--bad:#991b1b;--bad-soft:#fff;--warn:#92400e;--warn-soft:#fff;--accent:#0f766e}
  body{background:#fff;font-size:12px}
  .no-print{display:none!important}
  .print-only{display:block!important}
  table.print-only{display:table!important}
  .name-line{display:flex!important}
  .ws{max-width:none;padding:0;gap:12px}
  .card{box-shadow:none;break-inside:avoid;padding:14px;border-radius:8px}
  .hero{background:#fff}
  .badge{background:#fff;color:#000;border:1px solid #000}
  .topic,.persona,.q,.bq{break-inside:avoid}
  textarea.notes{border:1px solid #94a3b8;min-height:90px;resize:none}
  .opt{padding:4px 8px;margin-bottom:4px}
  .line{border-bottom:1px solid #000;height:22px;margin-top:6px}
}
</style>
</head>
<body>
<div id="ws"></div>
<script>
function createWorksheet(root, d, opts) {
  opts = opts || {};
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var norm = function (s) {
    return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9\s'-]/g, '').replace(/\s+/g, ' ').trim();
  };
  var L = 'ABCDEFGH';
  var n = 0;
  var head = function (t, sub) {
    n += 1;
    return '<div class="sec-h"><span class="sec-n">' + n + '</span><div><h2>' + esc(t) + '</h2>' +
      (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + '</div></div>';
  };
  var idOk = /^[\w-]{11}$/.test(d.videoId || '');
  var ytUrl = idOk ? 'https://www.youtube.com/watch?v=' + d.videoId : '';
  var embed = idOk ? 'https://www.youtube.com/embed/' + d.videoId + '?rel=0&modestbranding=1' : '';
  var h = '';

  h += '<div class="ws-bar no-print">' +
    '<button type="button" class="btn" data-act="key" aria-pressed="false">🔑 Answer key: Off</button>' +
    '<button type="button" class="btn" data-act="print">🖨 Print / PDF</button></div>';

  h += '<header class="card hero"><div><span class="badge">CEFR ' + esc(d.cefrLevel) + '</span>' +
    (d.demo ? ' <span class="badge badge-warn">Demo content</span>' : '') + '</div>' +
    '<h1>' + esc(d.title) + '</h1>' +
    (d.subtitle ? '<p class="lead">' + esc(d.subtitle) + '</p>' : '') +
    '<div class="name-line print-only"><span>Name: ____________________</span><span>Date: ____________</span></div>' +
    (ytUrl ? '<p class="src"><span class="print-only">Video: </span><a class="no-print" href="' + esc(ytUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(ytUrl) + '</a><span class="print-only">' + esc(ytUrl) + '</span></p>' : '') +
    '</header>';

  if (d.warmup) {
    h += '<section class="card">' + head('Warm-up & discussion', 'Talk about these topics before you watch the video.') +
      '<div class="grid3">' + d.warmup.questions.map(function (q, i) {
        return '<div class="topic"><span class="topic-l">Topic ' + L[i] + '</span><p>' + esc(q) + '</p></div>';
      }).join('') + '</div>' +
      '<div class="starters no-print" role="group" aria-label="Sentence starters">' + d.warmup.starters.map(function (s) {
        return '<button type="button" class="chip" data-starter="' + esc(s) + '">+ ' + esc(s) + '</button>';
      }).join('') + '</div>' +
      '<p class="print-only" style="margin:10px 0"><b>Useful phrases:</b> ' + esc(d.warmup.starters.join('  •  ')) + '</p>' +
      '<textarea class="notes" rows="3" aria-label="Discussion notes" placeholder="Write your ideas here…"></textarea></section>';
  }

  if (d.vocab) {
    h += '<section class="card">' + head('Key vocabulary', 'Click a card to see the meaning. Use 🔊 to hear the word.');
    h += '<div class="fc-grid no-print">' + d.vocab.list.map(function (v) {
      return '<div class="fc-wrap"><button type="button" class="fc" data-flip aria-pressed="false" aria-label="Flip card: ' + esc(v.term) + '">' +
        '<span class="fc-in"><span class="fc-face fc-front"><span><span class="pos">' + esc(v.partOfSpeech) + '</span>' +
        '<span class="fc-term">' + esc(v.term) + '</span><span class="fc-ph">' + esc(v.phonetic) + '</span></span>' +
        '<span class="fc-hint">Tap to flip ➔</span></span>' +
        '<span class="fc-face fc-back"><span><span class="fc-lab">Meaning</span><span class="fc-def">' + esc(v.definition) + '</span></span>' +
        '<span class="fc-ex">“' + esc(v.example) + '”</span></span></span></button>' +
        '<button type="button" class="fc-speak" data-speak="' + esc(v.term) + '" aria-label="Pronounce ' + esc(v.term) + '">🔊</button></div>';
    }).join('') + '</div>';
    h += '<table class="vtable print-only"><thead><tr><th>Word</th><th>Type</th><th>Meaning</th><th>Example</th></tr></thead><tbody>' +
      d.vocab.list.map(function (v) {
        return '<tr><td><b>' + esc(v.term) + '</b><br>' + esc(v.phonetic) + '</td><td>' + esc(v.partOfSpeech) + '</td><td>' + esc(v.definition) + '</td><td><i>' + esc(v.example) + '</i></td></tr>';
      }).join('') + '</tbody></table>';
    if (d.vocab.quiz.length) {
      var bank = d.vocab.quiz.map(function (q) { return q.answer; }).sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
      h += '<h3 class="mini">Fill in the blanks</h3><div class="bank" aria-label="Word bank">' +
        bank.map(function (w) { return '<span>' + esc(w) + '</span>'; }).join('') + '</div>';
      h += d.vocab.quiz.map(function (q, i) {
        return '<div class="bq" data-answer="' + esc(q.answer) + '"><p><b>' + (i + 1) + '.</b> ' +
          esc(q.sentence).replace(/_{2,}/g, '<span class="blank"></span>') + '</p>' +
          '<div class="bq-row no-print"><input class="blank-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer for sentence ' + (i + 1) + '" placeholder="Type the word…">' +
          '<button type="button" class="btn btn-sm btn-primary" data-check>Check</button><span class="res" aria-live="polite"></span></div>' +
          '<p class="key-ans">Answer: ' + esc(q.answer) + '</p></div>';
      }).join('');
    }
    h += '</section>';
  }

  if (d.video) {
    h += '<section class="card no-print">' + head('Watch the video', 'Watch once for the main idea, then again for details.');
    if (embed) {
      h += '<div class="player"><iframe id="ws-player" src="' + esc(embed) + '" title="Video player" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>' +
        '<a class="yt-link" href="' + esc(ytUrl) + '" target="_blank" rel="noopener noreferrer">Video not loading? Open it on YouTube ↗</a>';
    }
    if (d.video.timestamps && d.video.timestamps.length) {
      h += '<h3 class="mini">Jump to a moment</h3><div class="ts-grid">' + d.video.timestamps.map(function (t) {
        return '<button type="button" class="ts" data-seek="' + t.seconds + '"><b>' + esc(t.time) + '</b><span>' + esc(t.label) + '</span></button>';
      }).join('') + '</div>';
    }
    h += '</section>';
  }

  if (d.comprehension) {
    h += '<section class="card">' + head('Comprehension', 'Choose the best answer based on the video.') +
      d.comprehension.map(function (q, i) {
        return '<div class="q" data-correct="' + q.correct + '"><p class="q-t">' + (i + 1) + '. ' + esc(q.question) + '</p>' +
          q.options.map(function (o, j) {
            return '<label class="opt' + (j === q.correct ? ' is-correct' : '') + '"><input type="radio" name="mcq' + i + '" value="' + j + '">' +
              '<span class="opt-l">' + L[j] + '</span><span>' + esc(o) + '</span></label>';
          }).join('') +
          '<div class="fb"><span class="fb-res"></span><span class="key-ans">Answer: ' + L[q.correct] + '</span>' + esc(q.explanation) + '</div></div>';
      }).join('') + '</section>';
  }

  if (d.debrief) {
    h += '<section class="card">' + head('Role-play & reflection', 'Pick a role and answer from that person’s point of view.') +
      '<div class="grid2">' + d.debrief.personas.map(function (p) {
        return '<div class="persona"><div class="persona-h"><span class="ic" aria-hidden="true">' + esc(p.icon) + '</span><span>' + esc(p.name) + '</span></div>' +
          '<p class="pr">“' + esc(p.prompt) + '”</p>' +
          '<textarea class="notes" rows="3" aria-label="Response as ' + esc(p.name) + '" placeholder="Write your response…"></textarea></div>';
      }).join('') + '</div></section>';
  }

  root.innerHTML = '<div class="ws">' + h + '</div>';
  var ws = root.querySelector('.ws');

  function setKey(on) {
    ws.classList.toggle('show-key', on);
    var b = root.querySelector('[data-act="key"]');
    if (b) { b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = '🔑 Answer key: ' + (on ? 'On' : 'Off'); }
  }
  function checkBlank(bq) {
    var inp = bq.querySelector('.blank-in'), res = bq.querySelector('.res');
    var v = norm(inp.value);
    if (!v) { res.className = 'res'; res.textContent = ''; inp.focus(); return; }
    var ok = v === norm(bq.getAttribute('data-answer'));
    res.className = 'res ' + (ok ? 'ok' : 'bad');
    res.textContent = ok ? '✓ Correct!' : '✗ Not quite, try again';
  }
  root.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act],[data-flip],[data-speak],[data-starter],[data-check],[data-seek]') : null;
    if (!t || !root.contains(t)) return;
    if (t.hasAttribute('data-act')) {
      if (t.getAttribute('data-act') === 'key') setKey(!ws.classList.contains('show-key'));
      else window.print();
    } else if (t.hasAttribute('data-flip')) {
      t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    } else if (t.hasAttribute('data-speak')) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t.getAttribute('data-speak'));
        u.lang = 'en-GB'; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
