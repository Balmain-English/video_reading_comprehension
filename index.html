<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Reading Comprehension</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1422;
        --panel: #172436;
        --primary: #9eb8d2;
        --primary-dark: #d7e3ef;
        --text: #edf2f7;
        --muted: #a5b2c2;
        --border: #52657a;
        --button-hover: #293d53;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(ellipse at 50% -20%, rgba(116, 145, 174, 0.2), transparent 55%),
          linear-gradient(145deg, #0b1422 0%, #142238 52%, #0c1726 100%);
        color: var(--text);
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 64px 20px 80px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.035em;
        color: #f4f7fa;
      }

      .subtitle {
        margin: 0 0 30px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .panel {
        position: relative;
        overflow: hidden;
        background:
          repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.018) 0, rgba(255, 255, 255, 0.018) 1px, transparent 1px, transparent 4px),
          linear-gradient(145deg, #1d2c40, #142235 75%);
        border: 1px solid #53677d;
        border-radius: 16px;
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        padding: 26px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }

      .page-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 58px;
        padding: 14px 18px;
        background: linear-gradient(180deg, #34475c 0%, #293b50 100%);
        color: var(--primary-dark);
        border: 1px solid #647a91;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 12px rgba(0, 0, 0, 0.12);
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .page-button:hover,
      .page-button:focus-visible {
        background: linear-gradient(180deg, #40566d 0%, #30465c 100%);
        border-color: #b4c6d8;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 7px 18px rgba(0, 0, 0, 0.24);
        transform: translateY(-2px);
      }

      .page-button:focus-visible {
        outline: 2px solid #d5e4f2;
        outline-offset: 3px;
      }

      .empty-state {
        color: var(--muted);
        font-style: italic;
      }

      .status {
        margin: 20px 0 0;
        padding-top: 16px;
        color: var(--muted);
        border-top: 1px solid rgba(158, 184, 210, 0.2);
        font-size: 0.95rem;
      }

      @media (max-width: 600px) {
        .container { padding: 40px 16px 56px; }
        .panel { padding: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Video Reading Comprehension</h1>
      <p class="subtitle">Choose a page below to open an activity.</p>

      <section class="panel">
        <div id="file-list" class="button-grid" aria-live="polite"></div>
        <p id="status" class="status">Loading available pages...</p>
      </section>
    </main>

    <script>
      const repoOwner = 'Balmain-English';
      const repoName = 'video_reading_comprehension';
      const branch = 'main';
      const fileList = document.getElementById('file-list');
      const statusText = document.getElementById('status');

      function cleanFileName(path) {
        return path
          .split('/')
          .pop()
          .replace(/\.html?$/i, '')
          .replace(/[-_]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function buildPageUrl(filePath) {
        return `https://${repoOwner.toLowerCase()}.github.io/${repoName}/${encodeURI(filePath)}`;
      }

      async function loadHtmlFiles() {
        try {
          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branch}?recursive=1`);

          if (!response.ok) {
            throw new Error(`GitHub API request failed with status ${response.status}`);
          }

          const data = await response.json();
          const htmlFiles = (data.tree || [])
            .filter((item) => item.type === 'blob' && /\.html?$/i.test(item.path))
            .filter((item) => item.path.toLowerCase() !== 'index.html')
            .sort((a, b) => a.path.localeCompare(b.path));

          fileList.innerHTML = '';

          if (!htmlFiles.length) {
            fileList.innerHTML = '<div class="empty-state">No HTML files have been added yet.</div>';
            statusText.textContent = 'Add an HTML file to this repository and it will appear here automatically.';
            return;
          }

          htmlFiles.forEach((file) => {
            const link = document.createElement('a');
            link.href = buildPageUrl(file.path);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = 'page-button';
            link.textContent = cleanFileName(file.path);
            fileList.appendChild(link);
          });

          statusText.textContent = `${htmlFiles.length} page${htmlFiles.length === 1 ? '' : 's'} available.`;
        } catch (error) {
          fileList.innerHTML = '<div class="empty-state">Unable to load pages right now.</div>';
          statusText.textContent = 'Check that the repository is public and that GitHub Pages has been enabled.';
          console.error(error);
        }
      }

      loadHtmlFiles();
    </script>
  </body>
</html>
