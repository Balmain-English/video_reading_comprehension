<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10243a" />
    <title>Video Reading Comprehension</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #10243a;
        --navy-2: #1d3557;
        --steel: #68798a;
        --steel-light: #d7dfe7;
        --bg: #eef3f7;
        --panel: #ffffff;
        --text: #1d2b3a;
        --muted: #5a6f82;
        --border: #cfd9e2;
        --shadow: rgba(16, 36, 58, 0.08);
        --accent: #287c83;
        --accent-strong: #1d6269;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background: linear-gradient(180deg, #f5f8fb 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 18px 56px;
      }

      .masthead {
        margin-bottom: 22px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }

      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-top: 14px;
      }

      h1 {
        margin: 0;
        color: var(--navy);
        font-size: clamp(1.8rem, 2.5vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--navy);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .subtitle {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .panel {
        position: relative;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-top: 4px solid var(--navy-2);
        border-radius: 12px;
        box-shadow: 0 18px 40px var(--shadow);
        padding: 20px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .page-button {
        --page-accent: var(--accent);
        --page-accent-soft: rgba(40, 124, 131, 0.12);
        --page-accent-strong: var(--accent-strong);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        min-height: 116px;
        padding: 12px 12px 10px;
        background: linear-gradient(180deg, #ffffff 0%, #f3f7fa 100%);
        color: var(--text);
        border: 1px solid var(--border);
        border-left: 4px solid var(--page-accent);
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(16, 36, 58, 0.04);
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }

      .page-button:hover,
      .page-button:focus-visible {
        transform: translateY(-2px);
        border-color: var(--page-accent);
        box-shadow: 0 10px 20px rgba(16, 36, 58, 0.08);
      }

      .page-button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--page-accent) 32%, white);
        outline-offset: 3px;
      }

      .page-label {
        display: inline-flex;
        align-self: flex-start;
        padding: 4px 7px;
        border-radius: 999px;
        background: var(--page-accent-soft);
        color: var(--page-accent-strong);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .page-title {
        margin-top: 12px;
        font-size: 0.94rem;
        font-weight: 700;
        line-height: 1.35;
        color: var(--navy);
        overflow-wrap: anywhere;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 26px 18px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: #f9fbfd;
        color: var(--muted);
        font-style: italic;
      }

      .status {
        margin: 18px 0 0;
        padding-top: 14px;
        color: var(--muted);
        border-top: 1px solid var(--steel-light);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .button-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .container { padding: 24px 14px 48px; }
        .panel { padding: 14px; }
        .title-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
        .button-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .page-button { min-height: 104px; }
      }

      @media (max-width: 360px) {
        .button-grid { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="masthead">
        <div class="eyebrow">Language learning</div>
        <div class="title-row">
          <h1>Video Reading Comprehension</h1>
          <span id="page-count" class="meta-pill">0 pages</span>
        </div>
        <p class="subtitle">Choose a page below to open an activity.</p>
      </header>

      <section class="panel">
        <div id="file-list" class="button-grid" aria-live="polite"></div>
        <p id="status" class="status">Loading available pages...</p>
      </section>
    </main>

    <script>
      const repoOwner = 'Balmain-English';
      const repoName = 'video-reading';
      const branch = 'main';
      const fileList = document.getElementById('file-list');
      const statusText = document.getElementById('status');
      const pageCountText = document.getElementById('page-count');

      const paletteMap = {
        default: { accent: '#287c83', accentSoft: 'rgba(40, 124, 131, 0.12)', accentStrong: '#1d6269' },
        reading: { accent: '#4f46e5', accentSoft: 'rgba(79, 70, 229, 0.12)', accentStrong: '#4338ca' },
        negotiation: { accent: '#0f766e', accentSoft: 'rgba(15, 118, 110, 0.12)', accentStrong: '#115e59' },
        environment: { accent: '#0f766e', accentSoft: 'rgba(16, 185, 129, 0.12)', accentStrong: '#047857' },
        business: { accent: '#a16207', accentSoft: 'rgba(202, 138, 4, 0.12)', accentStrong: '#854d0e' },
        society: { accent: '#b91c1c', accentSoft: 'rgba(185, 28, 28, 0.12)', accentStrong: '#991b1b' },
        history: { accent: '#7c3aed', accentSoft: 'rgba(124, 58, 237, 0.12)', accentStrong: '#6d28d9' },
        technology: { accent: '#2563eb', accentSoft: 'rgba(37, 99, 235, 0.12)', accentStrong: '#1d4ed8' },
        culture: { accent: '#be185d', accentSoft: 'rgba(190, 24, 93, 0.12)', accentStrong: '#9d174d' }
      };

      function cleanFileName(path) {
        return path
          .split('/')
          .pop()
          .replace(/\.html?$/i, '')
          .replace(/[-_]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function getPageCategory(filePath) {
        const lowerName = filePath.toLowerCase();
        if (lowerName.includes('reading')) return 'reading';
        if (lowerName.includes('negotiat')) return 'negotiation';
        if (lowerName.includes('water') || lowerName.includes('aircon') || lowerName.includes('heating') || lowerName.includes('environment')) return 'environment';
        if (lowerName.includes('anthropic') || lowerName.includes('ipo') || lowerName.includes('pharma') || lowerName.includes('business')) return 'business';
        if (lowerName.includes('families') || lowerName.includes('couples') || lowerName.includes('society')) return 'society';
        if (lowerName.includes('gold') || lowerName.includes('history') || lowerName.includes('town')) return 'history';
        if (lowerName.includes('ai') || lowerName.includes('tech')) return 'technology';
        if (lowerName.includes('hendrix') || lowerName.includes('culture')) return 'culture';
        return 'default';
      }

      function getPalette(filePath) {
        return paletteMap[getPageCategory(filePath)] || paletteMap.default;
      }

      function buildPageUrl(filePath) {
        return `./${filePath.split('/').map(encodeURIComponent).join('/')}`;
      }

      function setCardPalette(link, filePath) {
        const palette = getPalette(filePath);
        link.style.setProperty('--page-accent', palette.accent);
        link.style.setProperty('--page-accent-soft', palette.accentSoft);
        link.style.setProperty('--page-accent-strong', palette.accentStrong);
      }

      async function loadHtmlFiles() {
        try {
          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branch}?recursive=1`);

          if (!response.ok) {
            throw new Error(`GitHub API request failed with status ${response.status}`);
          }

          const data = await response.json();
          const htmlFiles = (data.tree || [])
            .filter((item) => item.type === 'blob' && /\.html?$/i.test(item.path))
            .filter((item) => item.path.toLowerCase() !== 'index.html')
            .sort((a, b) => a.path.localeCompare(b.path));

          fileList.innerHTML = '';

          if (!htmlFiles.length) {
            fileList.innerHTML = '<div class="empty-state">No HTML files have been added yet.</div>';
            statusText.textContent = 'Add an HTML file to this repository and it will appear here automatically.';
            pageCountText.textContent = '0 pages';
            return;
          }

          pageCountText.textContent = `${htmlFiles.length} page${htmlFiles.length === 1 ? '' : 's'}`;

          htmlFiles.forEach((file) => {
            const link = document.createElement('a');
            link.href = buildPageUrl(file.path);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = 'page-button';
            setCardPalette(link, file.path);

            const category = getPageCategory(file.path);
            const label = category === 'default' ? 'resource' : category;
            link.innerHTML = `
              <span class="page-label">${label}</span>
              <span class="page-title">${cleanFileName(file.path)}</span>
            `;

            fileList.appendChild(link);
          });

          statusText.textContent = `${htmlFiles.length} page${htmlFiles.length === 1 ? '' : 's'} available.`;
        } catch (error) {
          fileList.innerHTML = '<div class="empty-state">Unable to load pages right now.</div>';
          statusText.textContent = 'Check that the repository is public and that GitHub Pages has been enabled.';
          pageCountText.textContent = 'Unavailable';
          console.error(error);
        }
      }

      loadHtmlFiles();
    </script>
  </body>
</html>
