<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10243a" />
    <title>Video Reading Comprehension</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #10243a;
        --navy-light: #1b3856;
        --steel: #68798a;
        --steel-light: #d7dfe7;
        --bg: #eef2f6;
        --panel: #ffffff;
        --text: #1c2b3a;
        --muted: #596b7c;
        --border: #cbd5df;
        --accent: #287c83;
        --accent-dark: #1d6269;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background:
          linear-gradient(135deg, rgba(16, 36, 58, 0.035) 25%, transparent 25%) 0 0 / 8px 8px,
          linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }

      h1 {
        margin: 0 0 8px;
        color: var(--navy);
        font-size: clamp(1.7rem, 2.5vw, 2.35rem);
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: .92rem;
        line-height: 1.5;
      }

      .panel {
        position: relative;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-top: 4px solid var(--navy-light);
        border-radius: 10px;
        box-shadow: 0 14px 36px rgba(16, 36, 58, 0.09);
        padding: 22px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .page-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 48px;
        padding: 10px 12px;
        background: linear-gradient(180deg, #ffffff 0%, #f1f4f7 100%);
        color: var(--navy);
        border: 1px solid #b9c5d0;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-size: .86rem;
        font-weight: 700;
        line-height: 1.35;
        overflow-wrap: anywhere;
        box-shadow: inset 0 1px 0 #ffffff, 0 2px 5px rgba(16, 36, 58, 0.06);
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .page-button:hover,
      .page-button:focus-visible {
        background: #e8f1f2;
        border-color: var(--accent);
        box-shadow: 0 5px 14px rgba(16, 36, 58, 0.12);
        transform: translateY(-2px);
      }

      .page-button:focus-visible {
        outline: 3px solid rgba(40, 124, 131, 0.35);
        outline-offset: 3px;
      }

      .empty-state {
        grid-column: 1 / -1;
        color: var(--muted);
        font-style: italic;
      }

      .status {
        margin: 18px 0 0;
        padding-top: 14px;
        color: var(--muted);
        border-top: 1px solid var(--steel-light);
        font-size: .82rem;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .button-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .container { padding: 36px 16px 48px; }
        .panel { padding: 16px; }
        .button-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .page-button { min-height: 44px; padding: 9px 10px; font-size: .82rem; }
      }

      @media (max-width: 360px) {
        .button-grid { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Video Reading Comprehension</h1>
      <p class="subtitle">Choose a page below to open an activity.</p>

      <section class="panel">
        <div id="file-list" class="button-grid" aria-live="polite"></div>
        <p id="status" class="status">Loading available pages...</p>
      </section>
    </main>

    <script>
      const repoOwner = 'Balmain-English';
      const repoName = 'video_reading_comprehension';
      const branch = 'main';
      const fileList = document.getElementById('file-list');
      const statusText = document.getElementById('status');

      function cleanFileName(path) {
        return path
          .split('/')
          .pop()
          .replace(/\.html?$/i, '')
          .replace(/[-_]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function buildPageUrl(filePath) {
        return `https://${repoOwner.toLowerCase()}.github.io/${repoName}/${encodeURI(filePath)}`;
      }

      async function loadHtmlFiles() {
        try {
          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branch}?recursive=1`);

          if (!response.ok) {
            throw new Error(`GitHub API request failed with status ${response.status}`);
          }

          const data = await response.json();
          const htmlFiles = (data.tree || [])
            .filter((item) => item.type === 'blob' && /\.html?$/i.test(item.path))
            .filter((item) => item.path.toLowerCase() !== 'index.html')
            .sort((a, b) => a.path.localeCompare(b.path));

          fileList.innerHTML = '';

          if (!htmlFiles.length) {
            fileList.innerHTML = '<div class="empty-state">No HTML files have been added yet.</div>';
            statusText.textContent = 'Add an HTML file to this repository and it will appear here automatically.';
            return;
          }

          htmlFiles.forEach((file) => {
            const link = document.createElement('a');
            link.href = buildPageUrl(file.path);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = 'page-button';
            link.textContent = cleanFileName(file.path);
            fileList.appendChild(link);
          });

          statusText.textContent = `${htmlFiles.length} page${htmlFiles.length === 1 ? '' : 's'} available.`;
        } catch (error) {
          fileList.innerHTML = '<div class="empty-state">Unable to load pages right now.</div>';
          statusText.textContent = 'Check that the repository is public and that GitHub Pages has been enabled.';
          console.error(error);
        }
      }

      loadHtmlFiles();
    </script>
  </body>
</html>
