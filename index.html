<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Reading Comprehension</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #1f6feb;
        --primary-dark: #174ea6;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f3;
        --button-hover: #e9f1ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .subtitle {
        margin: 0 0 30px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(31, 111, 235, 0.05);
        padding: 24px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      .page-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 56px;
        padding: 14px 18px;
        background: var(--panel);
        color: var(--primary-dark);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }

      .page-button:hover,
      .page-button:focus {
        background: var(--button-hover);
        border-color: var(--primary);
        transform: translateY(-1px);
      }

      .empty-state {
        color: var(--muted);
        font-style: italic;
      }

      .status {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Video Reading Comprehension</h1>
      <p class="subtitle">Choose a page below to open an activity.</p>

      <section class="panel">
        <div id="file-list" class="button-grid" aria-live="polite"></div>
        <p id="status" class="status">Loading available pages...</p>
      </section>
    </main>

    <script>
      const repoOwner = 'Balmain-English';
      const repoName = 'video_reading_comprehension';
      const branch = 'main';
      const fileList = document.getElementById('file-list');
      const statusText = document.getElementById('status');

      function cleanFileName(path) {
        return path
          .split('/')
          .pop()
          .replace(/\.html?$/i, '')
          .replace(/[-_]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function buildPageUrl(filePath) {
        return `https://${repoOwner.toLowerCase()}.github.io/${repoName}/${encodeURI(filePath)}`;
      }

      async function loadHtmlFiles() {
        try {
          const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branch}?recursive=1`);

          if (!response.ok) {
            throw new Error(`GitHub API request failed with status ${response.status}`);
          }

          const data = await response.json();
          const htmlFiles = (data.tree || [])
            .filter((item) => item.type === 'blob' && /\.html?$/i.test(item.path))
            .filter((item) => item.path.toLowerCase() !== 'index.html')
            .sort((a, b) => a.path.localeCompare(b.path));

          fileList.innerHTML = '';

          if (!htmlFiles.length) {
            fileList.innerHTML = '<div class="empty-state">No HTML files have been added yet.</div>';
            statusText.textContent = 'Add an HTML file to this repository and it will appear here automatically.';
            return;
          }

          htmlFiles.forEach((file) => {
            const link = document.createElement('a');
            link.href = buildPageUrl(file.path);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = 'page-button';
            link.textContent = cleanFileName(file.path);
            fileList.appendChild(link);
          });

          statusText.textContent = `${htmlFiles.length} page${htmlFiles.length === 1 ? '' : 's'} available.`;
        } catch (error) {
          fileList.innerHTML = '<div class="empty-state">Unable to load pages right now.</div>';
          statusText.textContent = 'Check that the repository is public and that GitHub Pages has been enabled.';
          console.error(error);
        }
      }

      loadHtmlFiles();
    </script>
  </body>
</html>
